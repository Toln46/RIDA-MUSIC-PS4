name: Build RGS MUSIC PS4

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RGS MUSIC
        uses: actions/checkout@v4

      - name: Use the tested BLACKOUT Scene2D renderer
        run: |
          test -s src/graphics.h
          test -s src/graphics.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install icon generator dependency
        run: python -m pip install --upgrade Pillow

      - name: Generate application icon
        run: python tools/make_icon.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Checkout OpenOrbis create-fself
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          path: tools/create-fself

      - name: Checkout OpenOrbis create-gp4
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-gp4
          path: tools/create-gp4

      - name: Build OpenOrbis helper tools
        run: |
          set -e
          mkdir -p tools/bin
          cd tools/create-fself/cmd/create-fself
          go build -o "$GITHUB_WORKSPACE/tools/bin/create-fself" -modfile=go-linux.mod
          cd "$GITHUB_WORKSPACE/tools/create-gp4/cmd/create-gp4"
          go build -o "$GITHUB_WORKSPACE/tools/bin/create-gp4" .

      - name: Build and independently inspect PS4 package
        run: |
          set -e
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
              set -e
              : "${OO_PS4_TOOLCHAIN:?OO_PS4_TOOLCHAIN is not set}"
              mkdir -p "$OO_PS4_TOOLCHAIN/bin/linux" sce_sys/about sce_module /workspace/audit_pkg
              install -m 755 /workspace/tools/bin/create-fself "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
              install -m 755 /workspace/tools/bin/create-gp4 "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"

              echo "=== Collecting required runtime modules ==="
              for module in libc.prx libSceFios2.prx; do
                source_module="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$module" -print -quit)"
                if [ -z "$source_module" ]; then
                  echo "ERROR: required runtime module $module was not found in OpenOrbis toolchain"
                  exit 1
                fi
                install -m 644 "$source_module" "sce_module/$module"
                test -s "sce_module/$module"
                echo "[OK] sce_module/$module ($(stat -c%s "sce_module/$module") bytes)"
              done

              RIGHT_SPRX="$(find "$OO_PS4_TOOLCHAIN" -name right.sprx -print -quit)"
              if [ -z "$RIGHT_SPRX" ]; then echo "OpenOrbis right.sprx was not found"; exit 1; fi
              cp "$RIGHT_SPRX" sce_sys/about/right.sprx

              echo "=== Build EBOOT and GP4 including sce_module PRX files ==="
              make
              PKG_FILE="$(find /workspace -maxdepth 1 -name "*.pkg" -print -quit)"
              test -n "$PKG_FILE"

              echo "=== PKG cryptographic/hash validation ==="
              "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$PKG_FILE"
              echo "=== Extracting installed game filesystem ==="
              "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_extract --verbose "$PKG_FILE" /workspace/audit_pkg
              for module in libc.prx libSceFios2.prx; do
                test -s "/workspace/audit_pkg/uroot/sce_module/$module" || {
                  echo "ERROR: $module is missing from the final PKG"
                  exit 1
                }
                echo "[OK] final PKG contains sce_module/$module"
              done

              echo "=== Extracting PKG metadata PARAM.SFO entry ==="
              PkgTool="$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
              ENTRY_LIST="$("$PkgTool" pkg_listentries "$PKG_FILE")"
              printf "%s\n" "$ENTRY_LIST"
              SFO_ENTRY_ID="$(printf "%s\n" "$ENTRY_LIST" | awk "toupper(\$0) ~ /PARAM_SFO/ {print \$4; exit}")"
              if [ -z "$SFO_ENTRY_ID" ]; then
                echo "ERROR: PARAM.SFO entry was not found in PKG metadata table"
                exit 1
              fi
              "$PkgTool" pkg_extractentry "$PKG_FILE" "$SFO_ENTRY_ID" /workspace/audit_pkg/param.sfo
              test -s /workspace/audit_pkg/param.sfo
              echo "[OK] extracted PKG metadata param.sfo (entry $SFO_ENTRY_ID)"
            '

      - name: Audit SELF header, fake-signature block and SFO metadata
        run: |
          python tools/validate_package.py \
            --eboot eboot.bin \
            --sfo sce_sys/param.sfo \
            --packaged-sfo audit_pkg/param.sfo

      - name: Upload validated PKG
        uses: actions/upload-artifact@v4
        with:
          name: RGS-MUSIC-PS4-PKG
          path: '*.pkg'
          if-no-files-found: error
          retention-days: 14
